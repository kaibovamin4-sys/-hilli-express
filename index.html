<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA: installable to the home screen on Android and iOS. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#07090c" />
    <!-- iOS ignores the manifest's display mode, so it needs these separately. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AUA" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter carries the app screens; Poppins and Source Serif 4 are the hero's
         display pair (the serif is used only for the italic accent word). One
         combined request so the hero's headline doesn't arrive a beat late. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@1,8..60,400;1,8..60,500&display=swap" rel="stylesheet">
